spring.application.name=chainops-be
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/chainops}
spring.datasource.username=${DATABASE_USERNAME:chainops}
spring.datasource.password=${DATABASE_PASSWORD:chainops}
spring.flyway.enabled=${FLYWAY_ENABLED:false}
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.prometheus.metrics.export.enabled=true
sentry.dsn=${SENTRY_DSN:}
sentry.environment=${SENTRY_ENVIRONMENT:local}
sentry.traces-sample-rate=${SENTRY_TRACES_SAMPLE_RATE:0.1}
